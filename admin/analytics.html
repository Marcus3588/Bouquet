<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics • Val's Pack Admin</title>
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    main { padding: 2rem; }
    .page-title { font-size: 2.2rem; font-weight: 700; color: #222; margin-bottom: 2rem; display: flex; align-items: center; gap: 1rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.8rem; margin-bottom: 3rem; }
    .stat-card { background: white; border-radius: 24px; padding: 2rem; text-align: center; box-shadow: 0 15px 40px rgba(255,51,133,0.12); border: 1px solid #ffe6f5; }
    .stat-value { font-size: 2.4rem; font-weight: 800; color: var(--brand-pink); }
    .stat-label { color: #666; margin-top: 0.5rem; }
    .chart-container { background: white; border-radius: 24px; padding: 2rem; box-shadow: 0 15px 40px rgba(255,51,133,0.12); border: 1px solid #ffe6f5; }
    canvas { max-height: 400px; }
  </style>
</head>
<body>
  <div class="container">
    <aside> <!-- Your sidebar → make Analytics active --> </aside>

    <main>
      <div class="page-title">
        <span class="material-symbols-sharp" style="font-size:2.6rem;color:var(--brand-pink)">trending_up</span>
        <h1>Analytics</h1>
      </div>

      <div class="stats-grid">
        <div class="stat-card"><div class="stat-value">$250022</div><div class="stat-label">Total Revenue</div></div>
        <div class="stat-card"><div class="stat-value">184</div><div class="stat-label">Orders This Month</div></div>
        <div class="stat-card"><div class="stat-value">97.3%</div><div class="stat-label">Happy Customers</div></div>
        <div class="stat-card"><div class="stat-value">42</div><div class="stat-label">New Customers</div></div>
      </div>

      <div class="chart-container">
        <canvas id="salesChart"></canvas>
      </div>

      <div class="chart-container" style="margin-top: 2rem;">
        <canvas id="topProductsChart"></canvas>
      </div>
    </main>
  </div>

  <script>
    const ctx1 = document.getElementById('salesChart').getContext('2d');
    new Chart(ctx1, {
      type: 'line',
      data: {
        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov'],
        datasets: [{
          label: 'Sales (₦)',
          data: [120000, 190000, 300000, 250000, 420000, 580000, 490000, 720000, 890000, 1100000, 2800000],
          borderColor: 'rgb(255, 51, 133)',
          backgroundColor: 'rgba(255, 51, 133, 0.1)',
          tension: 0.4,
          fill: true
        }]
      },
      options: { responsive: true, plugins: { legend: { position: 'top' } } }
    });

    const ctx2 = document.getElementById('topProductsChart').getContext('2d');
    new Chart(ctx2, {
      type: 'doughnut',
      data: {
        labels: ['Red Rose Bouquet', 'Pink Tulip Box', 'Sunflower Dream', 'White Lily', 'Mixed Box'],
        datasets: [{
          data: [38, 28, 19, 10, 5],
          backgroundColor: ['#ff3385', '#ff66b2', '#ffb3d1', '#ffe6f5', '#fff0f8']
        }]
      },
      options: { responsive: true }
    });
  </script>
</body>
</html>
