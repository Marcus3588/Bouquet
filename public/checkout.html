<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Val's Pack</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/checkout.css">
</head>
<body>

  <header class="checkout-header">
    <div class="container">
      <div class="logo">
        <h1><a href="index.html">Val's Pack</a></h1>
      </div>
      <div class="checkout-steps">
        <span>1. Cart</span> → <strong>2. Checkout</strong> → 3. Confirmation
      </div>
    </div>
  </header>

  <main class="checkout-container">
    <h2 class="checkout-title">Complete Your Order</h2>

    <!-- CHANGE #1: <div> → <form> -->
    <form id="checkoutForm" class="checkout-form">
      <div class="form-grid">
        <input type="text" placeholder="Full Name *" required>
        <input type="tel" placeholder="Phone Number (WhatsApp) *" required>
        <input type="text" placeholder="Delivery Address *" required>
        <input type="text" placeholder="City *" required>
        <input type="text" placeholder="Area / Landmark (optional)">
        <textarea placeholder="Special Delivery Instructions" rows="3"></textarea>
        <textarea placeholder="Personal Message for Card (optional)" rows="3"></textarea>
      </div>

      <div class="order-summary">
        <h3>Your Order</h3>
        <div id="orderItems"></div>
        <div class="summary-row"><span>Subtotal</span> <span id="subtotal">$0.00</span></div>
        <div class="summary-row"><span>Delivery Fee</span> <span>$9.99</span></div>
        <div class="total-row"><span>TOTAL</span> <span id="total">$0.00</span></div>
      </div>

      <!-- CHANGE #2: Button stays the same, but now it's inside a real <form> -->
      <button type="submit" class="place-order-btn" id="placeOrderBtn">
        Place Order - Pay on Delivery
      </button>
      <p class="cod-note">Cash on Delivery available • No payment needed now</p>
    </form>
    <!-- CHANGE #3: Close the <form> here -->

    <div class="empty-cart" id="emptyState" style="display:none;">
      <i class="fas fa-shopping-bag"></i>
      <h3>Nothing to checkout</h3>
      <p>Your cart is empty. Add some flowers first!</p>
      <a href="shop.html" class="btn-primary">Go Shopping</a>
    </div>
  </main>

  <script src="assets/js/checkout.js" defer></script>
</body>
</html>
