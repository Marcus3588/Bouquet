<!--Fallback page ( for bad URLs)-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – Lost in Petals – Val's Pack</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      height: 100vh;
      background: linear-gradient(135deg, #fff0f8, #ffeef8, #f8f0ff);
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      cursor: none; /* hide default cursor */
    }

    /* Custom cursor */
    .cursor {
      position: fixed;
      width: 40px;
      height: 40px;
      background: radial-gradient(circle, #ff66b2 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 9999;
      transition: transform 0.1s;
      mix-blend-mode: difference;
    }

    .error-container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 40px;
      color: white;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .error-code {
      font-size: 14rem;
      font-weight: 900;
      background: linear-gradient(90deg, #ff3385, #ff66b2, #ff99cc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glow 4s ease-in-out infinite alternate;
    }
    .error-message {
      font-size: 2.8rem;
      margin: 20px 0;
      animation: float 6s ease-in-out infinite;
    }
    .error-sub {
      font-size: 1.5rem;
      max-width: 600px;
      margin: 0 auto 50px;
      opacity: 0.9;
    }
    .btn-primary {
      padding: 22px 60px;
      background: white;
      color: #ff3385;
      border: none;
      border-radius: 60px;
      font-size: 1.6rem;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
      box-shadow: 0 20px 50px rgba(255,51,133,0.4);
      transition: all 0.4s;
    }
    .btn-primary:hover {
      transform: translateY(-12px) scale(1.08);
      box-shadow: 0 30px 70px rgba(255,51,133,0.6);
    }

    /* Interactive Petals */
    .petal {
      position: absolute;
      pointer-events: none;
      width: 50px;
      height: 60px;
      background: radial-gradient(circle at 30% 30%, #ff66b2, #ff3385);
      border-radius: 100% 0 100% 0;
      opacity: 0;
      transform-origin: center;
    }
    .petal:nth-child(odd) { background: radial-gradient(circle at 30% 30%, #ff99cc, #ff66b2); }
    .petal::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: inherit;
      border-radius: inherit;
      transform: rotate(90deg);
    }

    @keyframes glow {
      from { filter: brightness(1) drop-shadow(0 0 20px #ff66b2); }
      to { filter: brightness(1.3) drop-shadow(0 0 50px #ff99cc); }
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    @keyframes burst {
      0% { transform: scale(0) rotate(0deg); opacity: 1; }
      100% { transform: scale(1.5) rotate(360deg); opacity: 0; }
    }

    @media (max-width: 768px) {
      .error-code { font-size: 9rem; }
      .error-message { font-size: 2.2rem; }
      .error-sub { font-size: 1.3rem; }
      .btn-primary { padding: 18px 40px; font-size: 1.4rem; }
      .cursor { display: none; }
      body { cursor: default; }
    }
  </style>
</head>
<body>

  <!-- Custom cursor -->
  <div class="cursor" id="cursor"></div>

  <div class="error-container">
    <h1 class="error-code">404</h1>
    <h2 class="error-message">Lost in a Sea of Petals</h2>
    <p class="error-sub">
      Move your mouse (or finger) around to play with the petals!<br>
      The page you want isn't here… but magic is
    </p>
    <a href="index.html" class="btn-primary">Back to Beautiful Flowers</a>
  </div>

  <script>
    const cursor = document.getElementById('cursor');
    let mouseX = 0, mouseY = 0;
    let cursorX = 0, cursorY = 0;

    // Smooth cursor follow
    document.addEventListener('mousemove', e => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      burstPetals(e.clientX, e.clientY);
    });

    document.addEventListener('touchmove', e => {
      const touch = e.touches[0];
      mouseX = touch.clientX;
      mouseY = touch.clientY;
      burstPetals(touch.clientX, touch.clientY);
      cursor.style.left = mouseX + 'px';
      cursor.style.top = mouseY + 'px';
    });

    function animateCursor() {
      cursorX += (mouseX - cursorX) * 0.1;
      cursorY += (mouseY - cursorY) * 0.1;
      cursor.style.left = cursorX + 'px';
      cursor.style.top = cursorY + 'px';
      requestAnimationFrame(animateCursor);
    }
    animateCursor();

    // Create burst of petals on move
    function burstPetals(x, y) {
      for (let i = 0; i < 6; i++) {
        const petal = document.createElement('div');
        petal.classList.add('petal');
        petal.style.left = x + 'px';
        petal.style.top = y + 'px';
        petal.style.transform = `rotate(${Math.random() * 360}deg)`;

        const size = Math.random() * 30 + 30;
        petal.style.width = size + 'px';
        petal.style.height = size * 1.2 + 'px';

        document.body.appendChild(petal);

        // Animate and remove
        setTimeout(() => {
          petal.style.transition = 'all 1.5s ease-out';
          petal.style.transform += ` translate(${ (Math.random()-0.5)*300 }px, ${ (Math.random()-0.5)*300 }px) rotate(${Math.random()*720}deg)`;
          petal.style.opacity = '0';
        }, 10);

        setTimeout(() => petal.remove(), 2000);
      }
    }

    // Passive falling petals in background
    setInterval(() => {
      const petal = document.createElement('div');
      petal.classList.add('petal');
      petal.style.left = Math.random() * 100 + 'vw';
      petal.style.animation = `fall ${8 + Math.random()*8}s linear forwards`;
      petal.style.opacity = '0.6';
      document.body.appendChild(petal);
      setTimeout(() => petal.remove(), 16000);
    }, 800);

    // CSS fallback for fall animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes fall {
        to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
