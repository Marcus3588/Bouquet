<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop All Bouquets - Val's Pack</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Segoe UI',sans-serif; background:#fff5f8; padding-bottom:100px; }

    /* Floating Cart Button – fixed bottom-right */
    .floating-cart {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #ff3385, #ff66b2);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-shadow: 0 15px 40px rgba(255,51,133,0.5);
      z-index: 998;
      cursor: pointer;
      transition: all 0.4s;
      animation: pulse 3s infinite;
    }
    .floating-cart:hover {
      transform: scale(1.15);
      box-shadow: 0 25px 60px rgba(255,51,133,0.7);
    }
    .cart-count-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      background: white;
      color: #ff3385;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 15px 40px rgba(255,51,133,0.5); }
      50% { box-shadow: 0 20px 60px rgba(255,51,133,0.8); }
    }

    /* Mobile adjustment */
    @media (max-width: 480px) {
      .floating-cart { width: 65px; height: 65px; font-size: 1.8rem; bottom: 20px; right: 20px; }
    }

    /* Rest of your beautiful shop styles (same as before) */
    .shop-hero { background: linear-gradient(rgba(255,102,178,0.1), white), url('images/shop-hero.jpg') center/cover; padding: 140px 20px 80px; text-align: center; }
    .shop-hero h1 { font-size: 4rem; background: linear-gradient(90deg, #ff3385, #ff66b2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .filters { max-width: 1200px; margin: 0 auto; padding: 40px 20px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
    .filter-btn { padding: 12px 30px; background: white; border: 2px solid #ff99cc; border-radius: 50px; color: #ff66b2; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .filter-btn.active, .filter-btn:hover { background: #ff66b2; color: white; }
    .products-grid { max-width: 1300px; margin: 0 auto; padding: 0 20px 100px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 40px; }
    .product-card { background: white; border-radius: 32px; overflow: hidden; box-shadow: 0 20px 60px rgba(255,102,178,0.15); transition: all 0.4s; cursor: pointer; }
    .product-card:hover { transform: translateY(-18px); box-shadow: 0 35px 90px rgba(255,51,133,0.35); }
    .product-card img { width: 100%; height: 380px; object-fit: cover; transition: transform 0.6s; }
    .product-card:hover img { transform: scale(1.06); }
    .product-info { padding: 30px; text-align: center; }
    .product-info h3 { font-size: 1.6rem; margin: 0 0 10px; color: #333; }
    .product-info .price { font-size: 2rem; font-weight: bold; color: #ff3385; margin: 15px 0; }
    .add-btn { padding: 14px 40px; background: linear-gradient(135deg, #ff3385, #ff66b2); color: white; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .add-btn:hover { transform: translateY(-4px); }
  </style>
</head>
<body>

  <!-- Floating Cart Icon  -->
  <div class="floating-cart" onclick="window.location.href='cart.html'">
    <i class="fas fa-shopping-bag"></i>
    <div class="cart-count-badge" id="floatingCartCount">0</div>
  </div>

  <section class="shop-hero">
    <h1>Our Beautiful Bouquets</h1>
    <p>Tap any bouquet to see details • Fresh flowers delivered same-day in Lagos</p>
  </section>

  <div class="filters">
    <button class="filter-btn active" data-category="all">All</button>
    <button class="filter-btn" data-category="romance">Romance</button>
    <button class="filter-btn" data-category="birthday">Birthday</button>
    <button class="filter-btn" data-category="anniversary">Anniversary</button>
    <button class="filter-btn" data-category="sympathy">Sympathy</button>
  </div>

  <div class="products-grid" id="productsGrid"></div>

  <script>
    const allProducts = [
      {id:1, name:"Classic Red Roses", price:49.99, image:"images/delight.jpg", description:"12 premium red roses — the ultimate symbol of love.", category:"romance"},
      {id:2, name:"Sunny Sunflowers", price:39.99, image:"images/courage.jpg", description:"Bright sunflowers that instantly lift spirits.", category:"birthday"},
      {id:3, name:"Elegant White Tulips", price:44.99, image:"images/vow.jpg", description:"Pure white tulips for new beginnings.", category:"anniversary"},
      {id:4, name:"Rainbow Mixed Bouquet", price:59.99, image:"images/trust.jpg", description:"Colorful explosion of fresh seasonal blooms.", category:"romance"},
      {id:5, name:"Peaceful White Lilies", price:54.99, image:"images/lilly.jpg", description:"Calming lilies for comfort and peace.", category:"sympathy"},
      {id:6, name:"Birthday Bloom Box", price:69.99, image:"images/birthday.jpg", description:"Surprise box with card and colorful flowers!", category:"birthday"}
    ];

    localStorage.setItem('products', JSON.stringify(allProducts));

    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      const total = cart.reduce((sum, i) => sum + i.quantity, 0);
      document.getElementById('floatingCartCount').textContent = total;
      document.querySelectorAll('.cart-count').forEach(el => el.textContent = total);
    }

    function renderProducts(filter = 'all') {
      const grid = document.getElementById('productsGrid');
      const filtered = filter === 'all' ? allProducts : allProducts.filter(p => p.category === filter);

      grid.innerHTML = filtered.map(p => `
        <div class="product-card" onclick="window.location.href='product.html?id=${p.id}'">
          <img src="${p.image}" alt="${p.name}" loading="lazy">
          <div class="product-info">
            <h3>${p.name}</h3>
            <div class="price">$${p.price.toFixed(2)}</div>
            <button class="add-btn" onclick="event.stopPropagation(); addToCart(${p.id})">
              Add to Cart
            </button>
          </div>
        </div>
      `).join('');
    }

    window.addToCart = function(id) {
      let cart = JSON.parse(localStorage.getItem('cart') || '[]');
      const product = allProducts.find(p => p.id === id);
      const existing = cart.find(i => i.id === id);
      if (existing) existing.quantity += 1;
      else cart.push({...product, quantity:1});
      localStorage.setItem('cart', JSON.stringify(cart));
      alert(`${product.name} added!`);
      updateCartCount();
    };

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderProducts(btn.dataset.category);
      });
    });

    renderProducts();
    updateCartCount(); 
  </script>
</body>
</html>
